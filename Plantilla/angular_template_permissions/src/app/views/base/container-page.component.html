<div [ngClass]="{ 'push-right': pushRight, 'main-body': !!user }">
  <app-topnav (sidebarToggled)="expandSidebar()"></app-topnav>
  @if (!!user) {
    <app-sidebar (sidebarCollapsed)="toogleExpandMainContainer()"></app-sidebar>
  }
  <div
    [ngClass]="{
      'main-container-collapsed': expanded === false && !!user,
      'main-container': !!user && expanded === true,
    }"
  >
    <ng-content></ng-content>
  </div>
</div>
