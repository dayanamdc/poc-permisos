name: 0.1.$(Rev:r)

trigger: 
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: UseNode@1
    displayName: 'Use Node 20.19.0'
    inputs:
      version: '20.19.0'
      checkLatest: true

  - task: Npm@1
    displayName: 'npm install'
    inputs:
      command: 'install'
      verbose: true

# Disabled test command:
#  - task: Npm@1
#    displayName: 'npm test'
#    inputs:
#      command: 'custom'
#      verbose: true
#      customCommand: 'test'

  - task: Npm@1
    displayName: 'npm version'
    inputs:
      command: 'custom'
      verbose: true
      customCommand: 'version $(Build.BuildNumber) --allow-same-version --no-git-tag-version'

  - task: Npm@1
    displayName: 'npm build-uat'
    inputs:
      command: 'custom'
      verbose: true
      customCommand: 'run build-uat'
      
  - task: Npm@1
    displayName: 'npm build-prod'
    inputs:
      command: 'custom'
      verbose: true
      customCommand: 'run build-prod'

  - task: CopyFiles@2
    inputs:
      SourceFolder: 'dist'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'site'
      publishLocation: 'Container'
